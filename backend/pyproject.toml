[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ossquest"
version = "0.1.0"
description = "OSS Quest + PHOENIX: Autonomous Software Recovery Engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
]

[project.scripts]
ossq = "cli.ossq:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
